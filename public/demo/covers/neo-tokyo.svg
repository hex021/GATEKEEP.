<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05050A" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05050A" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Moon / Core Light -->
  <circle cx="400" cy="280" r="140" fill="#0F172A" stroke="#7C3AED" stroke-width="2" opacity="0.6" />
  <circle cx="400" cy="280" r="100" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.8" />
  <circle cx="400" cy="280" r="60" fill="url(#neonGlow)" filter="url(#glow)" opacity="0.3" />

  <!-- City Skyline Silhouettes -->
  <path d="M 100 480 L 100 360 L 140 360 L 140 340 L 170 340 L 170 480 Z" fill="#0A0F1D" />
  <path d="M 190 480 L 190 310 L 230 310 L 230 280 L 240 280 L 240 480 Z" fill="#0D1426" />
  <path d="M 260 480 L 260 380 L 310 380 L 310 480 Z" fill="#0A0F1D" />
  <path d="M 330 480 L 330 240 L 360 240 L 360 200 L 370 200 L 370 480 Z" fill="#111B33" />
  <path d="M 430 480 L 430 220 L 450 220 L 450 180 L 455 180 L 455 480 Z" fill="#111B33" />
  <path d="M 490 480 L 490 330 L 540 330 L 540 480 Z" fill="#0D1426" />
  <path d="M 570 480 L 570 290 L 610 290 L 610 480 Z" fill="#0A0F1D" />
  <path d="M 640 480 L 640 350 L 700 350 L 700 480 Z" fill="#070B14" />

  <!-- Skyline Windows / Neon Dots -->
  <circle cx="345" cy="260" r="2" fill="#06B6D4" />
  <circle cx="350" cy="290" r="2" fill="#7C3AED" />
  <circle cx="440" cy="240" r="2" fill="#06B6D4" />
  <circle cx="445" cy="280" r="2" fill="#7C3AED" />
  <circle cx="210" cy="330" r="2" fill="#06B6D4" />
  <circle cx="510" cy="360" r="2" fill="#06B6D4" />

  <!-- Cyber Horizon Line -->
  <line x1="0" y1="480" x2="800" y2="480" stroke="#06B6D4" stroke-width="2" filter="url(#glow)" />

  <!-- Perspective Highway / Grid -->
  <polygon points="360,480 440,480 750,800 50,800" fill="url(#roadGrad)" />
  <line x1="400" y1="480" x2="400" y2="800" stroke="#06B6D4" stroke-width="3" stroke-dasharray="24 16" filter="url(#glow)" />
  <line x1="380" y1="480" x2="225" y2="800" stroke="#7C3AED" stroke-width="1.5" opacity="0.6" />
  <line x1="420" y1="480" x2="575" y2="800" stroke="#7C3AED" stroke-width="1.5" opacity="0.6" />
  <line x1="365" y1="480" x2="50" y2="800" stroke="#7C3AED" stroke-width="1.5" opacity="0.4" />
  <line x1="435" y1="480" x2="750" y2="800" stroke="#7C3AED" stroke-width="1.5" opacity="0.4" />

  <!-- Horizontal Grid Lines -->
  <line x1="280" y1="520" x2="520" y2="520" stroke="#7C3AED" stroke-width="1" opacity="0.4" />
  <line x1="210" y1="580" x2="590" y2="580" stroke="#7C3AED" stroke-width="1" opacity="0.5" />
  <line x1="140" y1="660" x2="660" y2="660" stroke="#7C3AED" stroke-width="1.5" opacity="0.6" />
  <line x1="70" y1="760" x2="730" y2="760" stroke="#7C3AED" stroke-width="2" opacity="0.7" />

  <!-- Rain streaks -->
  <path d="M 120 100 L 100 160 M 320 80 L 300 140 M 620 120 L 600 180 M 240 220 L 220 280 M 520 200 L 500 260 M 700 240 L 680 300" 
        stroke="#06B6D4" stroke-width="1" stroke-dasharray="10 20" opacity="0.3" />

  <!-- Typography Overlay -->
  <g font-family="system-ui, -apple-system, sans-serif" letter-spacing="4">
    <text x="400" y="100" text-anchor="middle" font-size="14" fill="#06B6D4" font-weight="600" opacity="0.9">COLD CHROME CITY // 01</text>
    <text x="400" y="720" text-anchor="middle" font-size="28" fill="#FFFFFF" font-weight="800" letter-spacing="8" filter="url(#glow)">APATHEIA</text>
    <text x="400" y="750" text-anchor="middle" font-size="13" fill="#A78BFA" font-weight="500" letter-spacing="4">KURO &amp; THE GHOST CIRCUIT</text>
  </g>
</svg>
