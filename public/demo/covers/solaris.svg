<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="solarisBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0F0D" />
      <stop offset="60%" stop-color="#26120E" />
      <stop offset="100%" stop-color="#100A08" />
    </linearGradient>
    <linearGradient id="warmSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="tapeMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D211A" />
      <stop offset="50%" stop-color="#5A3127" />
      <stop offset="100%" stop-color="#3D211A" />
    </linearGradient>
    <filter id="warmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#solarisBg)" />

  <!-- Kodachrome 70s Color Stripes -->
  <rect x="0" y="40" width="800" height="8" fill="#FDBA74" opacity="0.8" />
  <rect x="0" y="48" width="800" height="8" fill="#D97706" opacity="0.8" />
  <rect x="0" y="56" width="800" height="8" fill="#C2410C" opacity="0.8" />
  <rect x="0" y="64" width="800" height="8" fill="#78230B" opacity="0.8" />

  <!-- Sunburst / Circular Vinyl Grooves -->
  <circle cx="400" cy="380" r="260" fill="none" stroke="#C2410C" stroke-width="1.5" opacity="0.2" />
  <circle cx="400" cy="380" r="230" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.3" />
  <circle cx="400" cy="380" r="200" fill="none" stroke="#FDBA74" stroke-width="1" opacity="0.4" />
  <circle cx="400" cy="380" r="170" fill="none" stroke="#C2410C" stroke-width="1" opacity="0.3" stroke-dasharray="12 6" />

  <!-- Golden Hour Sun -->
  <circle cx="400" cy="380" r="130" fill="url(#warmSun)" filter="url(#warmGlow)" opacity="0.9" />

  <!-- Venetian Blind Shadows Across Sun -->
  <line x1="260" y1="310" x2="540" y2="310" stroke="#1A0F0D" stroke-width="14" opacity="0.45" />
  <line x1="260" y1="340" x2="540" y2="340" stroke="#1A0F0D" stroke-width="14" opacity="0.45" />
  <line x1="260" y1="370" x2="540" y2="370" stroke="#1A0F0D" stroke-width="14" opacity="0.45" />
  <line x1="260" y1="400" x2="540" y2="400" stroke="#1A0F0D" stroke-width="14" opacity="0.45" />
  <line x1="260" y1="430" x2="540" y2="430" stroke="#1A0F0D" stroke-width="14" opacity="0.45" />
  <line x1="260" y1="460" x2="540" y2="460" stroke="#1A0F0D" stroke-width="14" opacity="0.45" />

  <!-- Tape Cassette Spool Window Motif -->
  <g transform="translate(400, 380)">
    <!-- Center Vinyl Label / Tape Hub -->
    <circle cx="0" cy="0" r="45" fill="#1A0F0D" stroke="#D97706" stroke-width="3" />
    <circle cx="0" cy="0" r="16" fill="#FDBA74" />
    <circle cx="0" cy="0" r="8" fill="#1A0F0D" />
  </g>

  <!-- Side Tape Reels -->
  <circle cx="270" cy="380" r="32" fill="none" stroke="#FDBA74" stroke-width="2" opacity="0.6" stroke-dasharray="6 6" />
  <circle cx="530" cy="380" r="32" fill="none" stroke="#FDBA74" stroke-width="2" opacity="0.6" stroke-dasharray="6 6" />
  <line x1="270" y1="412" x2="530" y2="412" stroke="#D97706" stroke-width="3" opacity="0.7" />

  <!-- Typography -->
  <g font-family="Georgia, serif" letter-spacing="3">
    <text x="400" y="140" text-anchor="middle" font-size="14" fill="#FDBA74" font-family="system-ui, sans-serif" font-weight="600" letter-spacing="6">VIA VENETO SESSIONS // 1974</text>
    <text x="400" y="690" text-anchor="middle" font-size="30" fill="#FFF7ED" font-weight="bold" letter-spacing="4">Honey on the Tape</text>
    <text x="400" y="730" text-anchor="middle" font-size="14" fill="#D97706" font-family="system-ui, sans-serif" font-weight="500" letter-spacing="5">SOLARIS QUINTET</text>
  </g>
</svg>
