<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="40%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <linearGradient id="supernovaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="35%" stop-color="#D946EF" />
      <stop offset="70%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <radialGradient id="burst" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#84CC16" />
      <stop offset="35%" stop-color="#D946EF" />
      <stop offset="70%" stop-color="#4338CA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F1117" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBurst" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#spaceGrad)" />

  <!-- Stars Background -->
  <g fill="#FFFFFF" opacity="0.4">
    <circle cx="120" cy="90" r="1.5" />
    <circle cx="280" cy="140" r="1" />
    <circle cx="680" cy="110" r="1.5" />
    <circle cx="720" cy="240" r="2" />
    <circle cx="90" cy="620" r="1.5" />
    <circle cx="710" cy="680" r="1" />
    <circle cx="180" cy="450" r="1" />
    <circle cx="640" cy="520" r="1.5" />
  </g>

  <!-- Supernova Core Burst -->
  <circle cx="400" cy="360" r="220" fill="url(#burst)" filter="url(#neonBurst)" />

  <!-- Geometric Wireframe Orbit Rings -->
  <ellipse cx="400" cy="360" rx="300" ry="100" fill="none" stroke="#D946EF" stroke-width="2" transform="rotate(-25 400 360)" opacity="0.7" />
  <ellipse cx="400" cy="360" rx="270" ry="80" fill="none" stroke="#84CC16" stroke-width="1.5" stroke-dasharray="8 6" transform="rotate(35 400 360)" opacity="0.8" />
  <ellipse cx="400" cy="360" rx="330" ry="120" fill="none" stroke="#4338CA" stroke-width="1.5" transform="rotate(75 400 360)" opacity="0.5" />

  <!-- Sacred Geometry / Wireframe Icosahedron Projection -->
  <polygon points="400,200 520,290 480,440 320,440 280,290" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
  <polygon points="400,200 400,360 480,440" fill="none" stroke="#D946EF" stroke-width="1.5" opacity="0.6" />
  <polygon points="400,200 400,360 320,440" fill="none" stroke="#84CC16" stroke-width="1.5" opacity="0.6" />
  <polygon points="400,360 520,290 480,440" fill="none" stroke="#4338CA" stroke-width="1.5" opacity="0.5" />
  <polygon points="400,360 280,290 320,440" fill="none" stroke="#4338CA" stroke-width="1.5" opacity="0.5" />

  <!-- Energy Rays -->
  <line x1="400" y1="360" x2="220" y2="120" stroke="#84CC16" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="400" y1="360" x2="600" y2="150" stroke="#D946EF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="400" y1="360" x2="620" y2="520" stroke="#84CC16" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <line x1="400" y1="360" x2="160" y2="480" stroke="#D946EF" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Typography -->
  <g font-family="system-ui, -apple-system, sans-serif" letter-spacing="4">
    <text x="400" y="80" text-anchor="middle" font-size="13" fill="#84CC16" font-weight="700" letter-spacing="6">ZERO GRAVITY SHIFT // 00</text>
    <text x="400" y="710" text-anchor="middle" font-size="28" fill="#FFFFFF" font-weight="900" letter-spacing="8" filter="url(#neonBurst)">COLLAPSED UNIVERSE</text>
    <text x="400" y="745" text-anchor="middle" font-size="14" fill="#D946EF" font-weight="600" letter-spacing="5">AURA 00</text>
  </g>
</svg>
